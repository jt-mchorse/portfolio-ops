name: audit-cron

# Continuous silent-rot check for the 13 portfolio repos, independent of
# session cadence. Runs weekly even if no autonomous session fires that week
# (operator on vacation, runner offline, etc.) so silent rot is caught on a
# 7-day worst case instead of an open-ended one.
#
# Spec: portfolio-ops#24. Lock test: tests/test_audit_cron_workflow.py.

on:
  schedule:
    # Mondays 07:00 PT (14:00 UTC). Lands a day before JT's Monday digest
    # review so a fresh issue is visible at the top of the inbox.
    - cron: '0 14 * * 1'
  workflow_dispatch:

# Cancel an in-flight run when the scheduled cron and a manual dispatch
# overlap, or when an operator dispatches twice in quick succession.
# Distinct group from tests / trending-* so they don't cancel each
# other when triggers happen to coincide.
concurrency:
  group: audit-cron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        # pyyaml is the dep for the missing-timeout and missing-concurrency
        # fingerprints in scripts/audit_phase_a.py. Without it, those two
        # checks no-op silently and the cron only finds the other four
        # shapes — defeating half the audit. Locked by
        # tests/test_audit_cron_workflow.py::test_pyyaml_installed.
        run: python -m pip install --quiet pyyaml

      - name: Run silent-rot audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/audit_phase_a.py | tee audit.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # Second pass in --json for the machine-readable fingerprints the
          # filing step compares against what was last reported (#72). Same
          # detection, different rendering; the human-readable audit.txt above
          # is what actually goes in the issue body.
          python3 scripts/audit_phase_a.py --json > findings.json
          # Don't fail the step here — the next steps fan out on exit code.
          exit 0

      - name: Report findings (file, or comment when the set changed)
        if: steps.audit.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # The dedupe is still keyed on the `audit-cron` label — that path is
          # locked by tests/test_audit_cron_workflow.py and is not what changed.
          # What changed is the PREDICATE (#72). This used to skip on the mere
          # PRESENCE of an open issue, so #56 — open since 2026-06-29 and
          # closable only by a secret JT has to configure (#17) — silenced
          # every finding for ~10 consecutive weekly runs. Measured on the
          # 2026-08-31 run: `findings: 1 across 13 repo(s)` immediately
          # followed by `skipping new file`. Nothing was lost only because the
          # set had not changed; the day it did, the cron would have found it
          # and said nothing.
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label audit-cron \
            --json number \
            --jq '.[0].number // empty')

          body_arg=""
          comments_arg=""
          open_arg=""
          if [ -n "$existing" ]; then
            open_arg="--has-open-issue"
            gh issue view "$existing" --repo "${{ github.repository }}" --json body \
              --jq '.body' > issue-body.md
            # Oldest-first: audit_issue_sync lets the newest recorded block win,
            # so an update comment supersedes the original body.
            gh issue view "$existing" --repo "${{ github.repository }}" --json comments \
              --jq '.comments | sort_by(.createdAt) | .[].body' > issue-comments.md
            body_arg="--issue-body issue-body.md"
            comments_arg="--issue-comments issue-comments.md"
          fi

          # shellcheck disable=SC2086  # the *_arg vars are deliberately unquoted flag pairs
          action=$(python3 scripts/audit_issue_sync.py \
            --findings-json findings.json \
            --out-state state.md \
            $open_arg $body_arg $comments_arg)
          echo "audit_issue_sync decided: $action"

          if [ "$action" = "silent" ]; then
            echo "Finding set unchanged since it was last reported on #$existing; nothing to say."
            exit 0
          fi

          {
            echo "## Silent-rot audit findings"
            echo ""
            echo "Triggered by \`audit-cron.yml\` at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            echo ""
            echo "**Run log:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Findings"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
            echo ""
            if [ "$action" = "comment" ]; then
              echo "_The finding set changed since this issue was last updated, so this is a new comment rather than a new issue — the label dedupe still holds. A set that has not changed stays silent, including across the weekly \`consecutive_failures\` increment._"
            else
              echo "_Filed automatically. Investigate each finding, fix or document, then close this issue. While it is open the cron will comment here when the finding set CHANGES, and stay silent when it does not (#72)._"
            fi
            echo ""
            echo "<!-- Machine-readable state for scripts/audit_issue_sync.py. Do not edit. -->"
            cat state.md
          } > body.md

          if [ "$action" = "comment" ]; then
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body-file body.md
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "[audit-cron] silent-rot findings $(date -u +%Y-%m-%d)" \
              --label audit-cron \
              --label priority:med \
              --body-file body.md
          fi

      - name: Fail workflow on fetch/network error
        if: steps.audit.outputs.exit_code == '2'
        run: |
          echo "::error::audit_phase_a.py returned exit 2 (fetch/network error); not filing an issue. The Actions tab failure surfaces this. Re-run manually if persistent."
          exit 1
