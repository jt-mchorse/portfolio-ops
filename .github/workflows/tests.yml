name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a newer push lands on the same ref. Cuts
# wall time on rapid push-on-push by ~30-60s of wasted CI quota.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + pyyaml
        run: python -m pip install --quiet pytest pyyaml
      - name: Run lock tests
        run: pytest tests/ -q

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify MEMORY layout
        run: |
          test -f MEMORY/full_history_ai.md
          test -f MEMORY/full_history_human.md
          test -f MEMORY/core_decisions_ai.md
          test -f MEMORY/core_decisions_human.md
      - name: Verify D-001 baseline decision exists
        run: 'grep -q "id: D-001" MEMORY/core_decisions_ai.md'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml
      # A ratchet, not a gate (#66, D-010): fails only if this repo's count of
      # unparseable session blocks grows past its committed baseline. It does
      # not demand zero -- MEMORY/ is append-only (handoff section 10) and
      # retro-fixing the existing 74 across the portfolio is JT's call.
      #
      # Only this repo's MEMORY/ is checked here, because it is the only one a
      # portfolio-ops CI checkout can see. The cross-repo invocation runs in
      # Phase A step 4 of session-runner/SESSION_PROMPT.md, beside
      # audit_phase_a.py, over each clone's origin/main (#112);
      # scripts/README.md documents it.
      - name: MEMORY YAML ratchet
        run: python scripts/check_memory_yaml.py --file MEMORY/full_history_ai.md --repo portfolio-ops
      # Same ratchet over the decisions file (#75, D-013). `test -f` and the
      # `grep -q "id: D-001"` above both pass on a file YAML cannot load, which
      # is how all 13 repos' core_decisions_ai.md went unloadable with this job
      # green. Counted per `- id:` entry, baseline in memory_yaml_baseline.json.
      - name: MEMORY decisions YAML ratchet
        run: python scripts/check_memory_yaml.py --kind decisions --file MEMORY/core_decisions_ai.md --repo portfolio-ops
